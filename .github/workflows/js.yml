name: JS

on:
  push:
    branches: [ main ]
    paths:
      - "impl/js/**"
      - "impl/js-*/**"
      - "test/fixtures/v0/**"
      - "package.json"
      - "eslint.config.ts"
      - "yarn.lock"
      - ".yarnrc.yml"
  pull_request:
    paths:
      - "impl/js/**"
      - "impl/js-*/**"
      - "test/fixtures/v0/**"
      - "package.json"
      - "eslint.config.ts"
      - "yarn.lock"
      - ".yarnrc.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      # Every package is tested even when another fails, so one red package
      # doesn't hide the state of the rest.
      fail-fast: false
      matrix:
        # One entry per JS package directory under impl/.
        package: [ js, js-knex ]
    defaults:
      run:
        working-directory: impl/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test run
