name: Publish JS Knex (npm)

# Triggered by pushing a tag like `@cptn-fizzbin/keycard-knex@1.2.3` (the package.json name, then
# `@` and the version). The version becomes the released package version (it
# does not need to match the version committed in package.json — that value is
# overwritten below).
on:
  push:
    tags:
      - "@cptn-fizzbin/keycard-knex@*"

defaults:
  run:
    working-directory: impl/js-knex

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derive release version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#@cptn-fizzbin/keycard-knex@}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' does not match @cptn-fizzbin/keycard-knex@X.Y.Z" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test run

      - name: Set release version
        run: npm pkg set version=${{ steps.version.outputs.version }}

      - name: Publish to npm
        run: yarn npm publish --access public
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
