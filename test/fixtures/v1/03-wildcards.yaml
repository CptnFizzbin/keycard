version: "1.0.0"
name: "default _ANY_ wildcard"
description: >
  meta/meta.anyAction/meta.anySubject are all absent, so the wildcard token
  defaults to "_ANY_" for both positions (§4.2.1).
rules:
  - [allow, Read, _ANY_]
  - [allow, _ANY_, Article, { owner_id: 1 }]
  - [deny, Delete, _ANY_]

cases:
  - name: "wildcard subject matches Read on any subject"
    action: Read
    subject: Comment
    expected: allow

  - name: "wildcard subject matches Read on the named subject too"
    action: Read
    subject: Article
    expected: allow

  - name: "wildcard action, concrete subject, satisfied condition"
    action: Update
    subject: Article
    subjectData: { owner_id: 1 }
    expected: allow

  - name: "wildcard action, concrete subject, unsatisfied condition"
    action: Update
    subject: Article
    subjectData: { owner_id: 2 }
    expected: deny

  - name: "blanket deny on Delete matches any subject"
    action: Delete
    subject: Comment
    expected: deny

  - name: >
      Delete on Article is denied even for the owner, because the
      unconditional wildcard-subject deny rule is declared after the
      owner-conditioned rule
    action: Delete
    subject: Article
    subjectData: { owner_id: 1 }
    expected: deny

  - name: "no rule covers this action/subject at all"
    action: Create
    subject: Comment
    expected: deny

---
version: "1.0.0"
name: "a custom wildcard token for actions only"
description: >
  meta.anyAction overrides the action wildcard token; meta.anySubject is
  left at its "_ANY_" default. The two positions are independent: since
  anyAction no longer means "_ANY_", the literal string "_ANY_" is now
  just an ordinary action name for this policy.
meta:
  anyAction: "ALL_ACTIONS"
rules:
  - [allow, ALL_ACTIONS, Article]
  - [allow, Read, _ANY_]

cases:
  - name: "ALL_ACTIONS is the action wildcard now"
    action: Update
    subject: Article
    expected: allow

  - name: "the literal action _ANY_ is only ever the wildcard for the subject position here, not the action position - it still hits the action wildcard rule though, since that rule matches every action"
    action: _ANY_
    subject: Article
    expected: allow

  - name: "_ANY_ is still the subject wildcard (untouched by anyAction)"
    action: Read
    subject: Comment
    expected: allow

  - name: "Read on Article matches both rules; either way the result is allow"
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "disabling the subject wildcard entirely"
description: >
  meta.anySubject: null disables the wildcard mechanism for the subject
  position — every rule's Subject, including the literal string "_ANY_", is
  now matched purely literally (§4.2.1).
meta:
  anySubject: null
rules:
  - [allow, Read, _ANY_]

cases:
  - name: "_ANY_ is now just an ordinary, literal subject name"
    action: Read
    subject: "_ANY_"
    expected: allow

  - name: "a different subject name does not match, because the wildcard is disabled"
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "disabling the action wildcard entirely"
meta:
  anyAction: null
rules:
  - [allow, _ANY_, Article]

cases:
  - name: "_ANY_ is now just an ordinary, literal action name"
    action: "_ANY_"
    subject: Article
    expected: allow

  - name: "a different action name does not match, because the wildcard is disabled"
    action: Read
    subject: Article
    expected: deny
