version: "1.0.0"
name: "$or (§7.4.7)"
rules:
  - [allow, Read, Article, { $or: [{ status: published }, { status: featured }] }]

cases:
  - name: "first alternative satisfied: allowed"
    subjectData: { status: published }
    action: Read
    subject: Article
    expected: allow

  - name: "second alternative satisfied: allowed"
    subjectData: { status: featured }
    action: Read
    subject: Article
    expected: allow

  - name: "no alternative satisfied: denied"
    subjectData: { status: draft }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$or with a non-array operand is a type issue, always false (§7.4.7)"
rules:
  - [allow, Read, Article, { $or: { status: published } }]

cases:
  - name: "operand is not an array: never matches"
    subjectData: { status: published }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$or: [] is vacuously false (§7.4.7)"
rules:
  - [allow, Read, Article, { $or: [] }]

cases:
  - name: "no alternative can ever be satisfied: always denied"
    subjectData: { status: published }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$and (§7.4.8)"
rules:
  - [allow, Read, Article, { $and: [{ status: published }, { view_count: { $gt: 100 } }] }]

cases:
  - name: "every conjunct satisfied: allowed"
    subjectData: { status: published, view_count: 200 }
    action: Read
    subject: Article
    expected: allow

  - name: "one conjunct unsatisfied: denied"
    subjectData: { status: published, view_count: 50 }
    action: Read
    subject: Article
    expected: deny

  - name: "the other conjunct unsatisfied: denied"
    subjectData: { status: draft, view_count: 200 }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$and with a non-array operand is a type issue, always false (§7.4.8)"
rules:
  - [allow, Read, Article, { $and: { status: published } }]

cases:
  - name: "operand is not an array: never matches"
    subjectData: { status: published }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$and: [] is vacuously true (§7.4.8)"
rules:
  - [allow, Read, Article, { $and: [] }]

cases:
  - name: "there is no unsatisfied conjunct: always allowed"
    subjectData: {}
    action: Read
    subject: Article
    expected: allow

  - name: "still always allowed regardless of the instance's other fields"
    subjectData: { anything: 1 }
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "$not (§7.4.9)"
rules:
  - [allow, Read, Article, { $not: { status: archived } }]

cases:
  - name: "inner condition is false: $not makes it true, so allowed"
    subjectData: { status: published }
    action: Read
    subject: Article
    expected: allow

  - name: "inner condition is true: $not makes it false, so denied"
    subjectData: { status: archived }
    action: Read
    subject: Article
    expected: deny

  - name: >
      $not is the exact negation of evaluating its inner condition against
      the same subject, with no special-casing for a missing field here:
      the inner field condition on a missing "status" key evaluates false
      (§7.3), and $not - sitting outside that field condition, negating
      its whole boolean result - negates that to true, so this is allowed.
      (This differs from $ne, which sits inside the field condition on
      "status" and so is subject to §7.3's missing-field short-circuit
      directly - $ne is carved out from it by name and also evaluates
      true on a missing field, per §7.4.2, but a $not nested *inside* a
      field condition, e.g. { status: { $not: { $eq: archived } } },
      isn't carved out and still gets the blanket false, even though $not
      has the same "exact negation" contract $ne does (§7.4.9) - undecided
      whether that should change; not addressed here.)
    subjectData: {}
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "multiple keys in one condition object are implicitly ANDed (§7.5)"
description: >
  An operator key MUST NOT consume the whole object or cause sibling keys
  to be ignored - mirrors the spec's own { $ne: null, status: open }
  example directly.
rules:
  - [allow, Update, Article, { $ne: null, status: open }]

cases:
  - name: "both the operator key and the field key are satisfied: allowed"
    subjectData: { status: open }
    action: Update
    subject: Article
    expected: allow

  - name: "the field key fails: denied, even though $ne null passes"
    subjectData: { status: closed }
    action: Update
    subject: Article
    expected: deny
