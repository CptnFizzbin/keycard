version: "1.1.0"
name: "embedded tests field is evaluation-inert"
description: >
  §4.4: a PolicyDefinition's optional `tests` field plays no role in
  evaluation - can/cannot/require MUST behave identically whether or not
  it's present, and regardless of its contents. This suite declares
  "1.1.0" (§2.2) since `tests` is a 1.1.0 addition; a compliance suite
  whose adapter hasn't been updated for 1.1.0 yet skips it automatically
  (see this directory's README.md, "Filtering by version").
rules:
  - [allow, Read, Article]
  - [allow, Update, Article, { owner_id: 1 }]
  - [allow, Delete, Article, { roles: { $has: admin } }]

tests:
  - name: "ownership"
    description: "documents the Update rule's intent"
    cases:
      - name: "owner can update their own article"
        check: [Update, Article, { owner_id: 1 }]
        expected: true
      - name: "non-owner cannot update someone else's article"
        check: [Update, Article, { owner_id: 2 }]
        expected: false
  - name: "admin override"
    cases:
      - check: [Delete, Article, { roles: [admin] }]
        expected: true
      - check: [Delete, Article, { roles: [] }]
        expected: false

cases:
  - name: "even a case this suite's own tests field also covers evaluates the same way"
    action: Update
    subject: Article
    subjectData:
      owner_id: 1
    expected: allow

  - name: "a case the tests field does not mention is unaffected too"
    action: Read
    subject: Article
    expected: allow

  - name: "an action/subject the tests field never checks still default-denies"
    action: Delete
    subject: Article
    subjectData:
      owner_id: 1
      roles: []
    expected: deny
