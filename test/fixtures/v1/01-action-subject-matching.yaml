version: "1.0.0"
name: "exact action/subject matching"
description: >
  §6.2.2: action and subject-name matching is an exact string comparison.
  No rule uses a wildcard here.
rules:
  - [allow, Read, Article]

cases:
  - name: "matching action and subject is allowed"
    action: Read
    subject: Article
    expected: allow

  - name: "unrelated subject is denied: no rule matches"
    action: Read
    subject: Comment
    expected: deny

  - name: "unrelated action is denied: no rule matches"
    action: Update
    subject: Article
    expected: deny

  - name: "action matching is case-sensitive"
    action: read
    subject: Article
    expected: deny

  - name: "subject matching is case-sensitive"
    action: Read
    subject: article
    expected: deny

---
version: "1.0.0"
name: "empty rule list"
description: "rules: [] denies everything; there is nothing to match."
rules: []

cases:
  - name: "any action/subject is denied"
    action: Read
    subject: Article
    expected: deny

  - name: "still denied with an instance attached"
    action: Delete
    subject: Article
    subjectData:
      id: 1
      owner_id: 1
    expected: deny
