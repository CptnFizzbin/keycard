version: "1.0.0"
name: "Article Ownership Policy"
description: >
  End-to-end mirror of the spec's own Appendix worked example
  (SPEC_V1-0.md, "Appendix: worked example"), $hasRole included: this
  conformance suite registers a real checker for it (subject.roles contains
  the requested role), so the admin-overrides-an-archive-deny case from the
  narrative appendix is reproduced here for real, not merely described.
meta:
  actions: [Read, Create, Update, Delete]
  subjects: [Article]
  operators: [$hasRole]
rules:
  - [allow, Read, _ANY_]
  - [allow, Create, Article]
  - [allow, Update, Article, { owner_id: 1 }]
  - [allow, Delete, Article, { owner_id: 1 }]
  - [deny, Delete, Article, { status: archived }]
  - [allow, Delete, Article, { $hasRole: admin }]

cases:
  - name: "Read is wide open on every subject, via the wildcard-subject rule"
    action: Read
    subject: Comment
    expected: allow

  - name: "Create on Article is unconditionally allowed"
    action: Create
    subject: Article
    expected: allow

  - name: "the owner can Update their own article"
    action: Update
    subject: Article
    subjectData: { owner_id: 1 }
    expected: allow

  - name: "a non-owner cannot Update the article"
    action: Update
    subject: Article
    subjectData: { owner_id: 2 }
    expected: deny

  - name: "the owner can Delete their own published article"
    action: Delete
    subject: Article
    subjectData: { owner_id: 1, status: published }
    expected: allow

  - name: >
      the owner cannot Delete their own archived article, because the deny
      rule is declared after the ownership allow rule and this subject has
      no admin role to trigger the override below it
    action: Delete
    subject: Article
    subjectData: { owner_id: 1, status: archived }
    expected: deny

  - name: >
      an admin CAN delete someone else's archived article, because the last
      rule ($hasRole: admin) is declared after - and so overrides - the
      blanket archived-article deny rule above it (§6 last-rule-wins)
    action: Delete
    subject: Article
    subjectData: { owner_id: 2, status: archived, roles: [admin] }
    expected: allow

  - name: "a non-owner cannot Delete a published article either"
    action: Delete
    subject: Article
    subjectData: { owner_id: 2, status: published }
    expected: deny
