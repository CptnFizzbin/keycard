version: "1.0.0"
name: "bare-value shorthand (§7.2)"
description: "{ status: archived } is shorthand for { status: { $eq: archived } }."
rules:
  - [allow, Read, Article, { status: published }]

cases:
  - name: "matching value is allowed"
    subjectData: { status: published }
    action: Read
    subject: Article
    expected: allow

  - name: "non-matching value is denied"
    subjectData: { status: draft }
    action: Read
    subject: Article
    expected: deny

  - name: "missing field is denied"
    subjectData: {}
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$ne is the exact negation of $eq, including on a missing field (§7.3, §7.4.2)"
description: >
  { status: { $ne: archived } } matches whenever status isn't "archived" -
  including when status is missing entirely, since $ne MUST be the exact
  negation of $eq (§7.4.2) and $eq on a missing field is false. This is the
  one exception to §7.3's blanket missing-field-is-false rule.
rules:
  - [allow, Read, Article, { status: { $ne: archived } }]

cases:
  - name: "present and different: allowed"
    subjectData: { status: published }
    action: Read
    subject: Article
    expected: allow

  - name: "present and equal: denied"
    subjectData: { status: archived }
    action: Read
    subject: Article
    expected: deny

  - name: "field missing entirely: allowed - $ne's exact-negation-of-$eq contract applies to absence too"
    subjectData: {}
    action: Read
    subject: Article
    expected: allow

  - name: "explicit null is a real value, and null !== archived, so this is allowed"
    subjectData: { status: null }
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "bare-value shorthand against an explicit null (§7.3)"
rules:
  - [allow, Read, Article, { status: null }]

cases:
  - name: "explicit null matches"
    subjectData: { status: null }
    action: Read
    subject: Article
    expected: allow

  - name: "a missing key does not match null - null is not a wildcard"
    subjectData: {}
    action: Read
    subject: Article
    expected: deny

  - name: "a non-null value does not match"
    subjectData: { status: draft }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "field conditions are top-level only in v1 - nesting is rejected (§7.4.10)"
description: >
  v1 restricts field conditions to a subject's own top-level fields;
  { name: "Alice" } here would be a second level of field narrowing
  (author -> name), which v1 doesn't support, so the whole condition always
  evaluates to false - regardless of what subject.author actually contains.
rules:
  - [allow, Read, Article, { author: { name: "Alice" } }]

cases:
  - name: "denied even though the nested data would have matched"
    subjectData: { author: { name: "Alice" } }
    action: Read
    subject: Article
    expected: deny

  - name: "denied when the nested data would not have matched either"
    subjectData: { author: { name: "Bob" } }
    action: Read
    subject: Article
    expected: deny

  - name: "denied when the outer field is missing"
    subjectData: {}
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "logical and comparison operators still nest inside a top-level field condition (§7.4.10)"
description: >
  The top-level-only restriction is about further FIELD narrowing, not about
  using $and/$or/$not/comparison operators against the field's own value -
  { author: { $ne: null } } stays a valid, ordinary top-level field
  condition.
rules:
  - [allow, Read, Article, { author: { $ne: null } }]

cases:
  - name: "field present and non-null: allowed"
    subjectData: { author: { name: "Alice" } }
    action: Read
    subject: Article
    expected: allow

  - name: "field missing: allowed ($ne's exact-negation-of-$eq exception applies here too, since $ne is the sole key)"
    subjectData: {}
    action: Read
    subject: Article
    expected: allow

---
version: "1.0.0"
name: "$field used to reach a second level of nesting is rejected the same way (§7.4.11)"
rules:
  - [allow, Read, Article, { author: { $field: ["name", "Alice"] } }]

cases:
  - name: "denied even though the nested data would have matched"
    subjectData: { author: { name: "Alice" } }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$field: explicit field access for a $-prefixed field name (§7.4.11)"
description: >
  A subject field literally named "$type" can't be reached with the bare-key
  form (`{ $type: ... }` would mean the $type operator), so this uses the
  { $field: [name, Condition] } long form instead.
rules:
  - [allow, Read, Article, { $field: ["$type", { $eq: news }] }]

cases:
  - name: "matching value via $field"
    subjectData: { "$type": news }
    action: Read
    subject: Article
    expected: allow

  - name: "non-matching value via $field"
    subjectData: { "$type": blog }
    action: Read
    subject: Article
    expected: deny

  - name: "missing field via $field"
    subjectData: {}
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$field with a malformed operand is a type issue, always false (§7.4.11)"
rules:
  - [allow, Read, Article, { $field: "not-a-tuple" }]

cases:
  - name: "malformed $field operand never matches"
    subjectData: { name: "x" }
    action: Read
    subject: Article
    expected: deny

---
version: "1.0.0"
name: "$field with the wrong tuple length is a type issue, always false (§7.4.11)"
rules:
  - [allow, Read, Article, { $field: ["name"] }]

cases:
  - name: "malformed $field operand (missing Condition element) never matches"
    subjectData: { name: "x" }
    action: Read
    subject: Article
    expected: deny
