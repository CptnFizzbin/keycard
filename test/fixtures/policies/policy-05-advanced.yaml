version: "1.0.0"
name: "Advanced Admin Policy"
description: "Complex nested conditions with logic operators"

meta:
  # $startsWithUpper is a custom operator this test suite registers a
  # checker for - it isn't a built-in, per SPEC_V1-0.md §7.4.12.
  operators: [$startsWithUpper]

rules:
  - [allow, Read, Article]
  - [allow, Create, Article]
  - [allow, Update, Article, {
      $or: [
        {
          $and: [
            { owner_id: 1 },
            { status: { $in: [draft, published] } }
          ]
        },
        { role: admin }
      ]
    }]
  - [allow, Delete, Article, {
      $and: [
        {
          $or: [
            { owner_id: 1 },
            { role: admin }
          ]
        },
        { status: { $ne: archived } },
        { view_count: { $lt: 100 } }
      ]
    }]
  - [allow, Publish, Article, {
      $and: [
        { owner_id: 1 },
        { status: draft },
        { title: { $startsWithUpper: true } }
      ]
    }]
  - [deny, Delete, Article, {
      $and: [
        { view_count: { $gte: 1000 } },
        { status: published }
      ]
    }]
