# Spec: https://keycard.cptnfizzbin.dev/spec/v0#can--cannot--require
# Spec: https://keycard.cptnfizzbin.dev/spec/v0#rules
version: "0.1"
name: "double-wildcard unconditional rule ordering"
description: >
  An unconditional [allow, _ANY_, _ANY_] rule is a legal, single rule whose
  position relative to other rules still follows last-rule-wins like any
  other rule.
rules:
  - [ deny, Delete, Article ]
  - [ allow, _ANY_, _ANY_ ]

tests:
  - name: "the trailing superuser rule overrides the earlier specific deny"
    check: [ Delete, Article ]
    expected: true

  - name: "the superuser rule matches anything"
    check: [ Anything, Whatever ]
    expected: true

---
# Spec: https://keycard.cptnfizzbin.dev/spec/v0#can--cannot--require
version: "0.1"
name: "double-wildcard unconditional rule declared first is overridable"
rules:
  - [ allow, _ANY_, _ANY_ ]
  - [ deny, Delete, Article ]

tests:
  - name: "the later, specific deny overrides the earlier superuser rule"
    check: [ Delete, Article ]
    expected: false

  - name: "anything not covered by the later deny still falls through to the superuser allow"
    check: [ Read, Article ]
    expected: true
