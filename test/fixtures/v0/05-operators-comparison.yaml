# Spec: https://keycard.cptnfizzbin.dev/spec/v0#gt--gte--lt--lte
version: "0.1"
name: "$lt"
rules:
  - [ allow, Read, Article, { view_count: { $lt: 100 } } ]

tests:
  - name: "strictly less: allowed"
    check: [ Read, Article, { view_count: 50 } ]
    expected: true

  - name: "equal to the boundary: denied ($lt is strict)"
    check: [ Read, Article, { view_count: 100 } ]
    expected: false

  - name: "greater than the boundary: denied"
    check: [ Read, Article, { view_count: 150 } ]
    expected: false

---
# Spec: https://keycard.cptnfizzbin.dev/spec/v0#gt--gte--lt--lte
version: "0.1"
name: "$lte"
rules:
  - [ allow, Read, Article, { view_count: { $lte: 100 } } ]

tests:
  - name: "strictly less: allowed"
    check: [ Read, Article, { view_count: 50, } ]
    expected: true

  - name: "equal to the boundary: allowed ($lte is inclusive)"
    check: [ Read, Article, { view_count: 100, } ]
    expected: true

  - name: "greater than the boundary: denied"
    check: [ Read, Article, { view_count: 150, } ]
    expected: false
