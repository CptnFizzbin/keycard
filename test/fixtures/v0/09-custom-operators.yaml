# Spec: https://keycard.cptnfizzbin.dev/spec/v0#custom-operators-op
version: "0.1"
name: "unregistered, undeclared custom operator always evaluates false"
description: >
  $hasRole isn't a built-in operator. With no meta.operators catalog
  declared and no checker registered at runtime, it MUST evaluate to false -
  never a no-op true, and never treated as a field name.
rules:
  - [ allow, Read, Article, { $hasRole: admin } ]

tests:
  - name: "unregistered custom operator: denied"
    check: [ Read, Article, { anything: 1 } ]
    expected: false

  - name: "still denied even with no instance data at all"
    check: [ Read, Article ]
    expected: false

# A cataloged-but-never-registered custom operator is not
# expressible as an allow/deny case here: declaring $hasRole in
# meta.operators without registering a checker for it MUST throw a
# PolicyLoadException at construction time, not merely log a diagnostic at
# evaluation time - see each implementation's own construction-time unit
# tests (e.g. impl/java's PolicyValidationTest, impl/js's policy.test.ts)
# instead.
# Spec: https://keycard.cptnfizzbin.dev/spec/v0#metaoperators

---
# Spec: https://keycard.cptnfizzbin.dev/spec/v0#custom-operators-op
# Spec: https://keycard.cptnfizzbin.dev/spec/v0#multi-key-condition-objects
version: "0.1"
name: "a $-prefixed key is always an operator, never a field name, even if unregistered"
description: >
  A subject that happens to have a literal "$hasRole" field is irrelevant -
  the condition key is resolved as an operator lookup, not a field lookup,
  and an unregistered operator is always false regardless of what data the
  subject carries.
rules:
  - [ allow, Read, Article, { $hasRole: admin } ]

tests:
  - name: "a literal $hasRole field on the subject is not consulted"
    check: [ Read, Article, { "$hasRole": admin } ]
    expected: false
