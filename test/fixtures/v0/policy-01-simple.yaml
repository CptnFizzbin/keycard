version: "0.1"
name: "Simple Blog Policy"
description: "Basic CRUD operations on blog articles"

rules:
  - [ allow, Read, Article ]
  - [ allow, Create, Article, { owner_id: 1 } ]

tests:
  - name: "allows Read on the Article type"
    check: [ Read, Article ]
    expected: true

  - name: "allows Read on any article instance regardless of owner"
    check: [ Read, Article, { owner_id: 2 } ]
    expected: true

  - name: "denies Create on the bare Article type (condition needs owner_id)"
    check: [ Create, Article ]

    expected: false
    check: [ Create, Article ]

  - name: "allows Create for owner_id 1"
    check: [ Create, Article, { owner_id: 1 } ]
    expected: true

  - name: "denies Create for owner_id 2"
    check: [ Create, Article, { owner_id: 2 } ]
    expected: false

  - name: "denies Update on Article (no rule allows it)"
    check: [ Update, Article, { owner_id: 1 } ]
    expected: false

  - name: "denies Delete on Article (no rule allows it)"
    check: [ Delete, Article ]
    expected: false

  - name: "denies Read on an unrelated subject type"
    check: [ Read, Comment ]
    expected: false
